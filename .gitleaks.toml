title = "Portfolio secret protection"

[extend]
useDefault = true

[[rules]]
id = "upstash-redis-rest-token"
description = "Upstash Redis REST credential, including low-entropy values"
regex = '''(?i)upstash_redis_rest_token["'`]?\s*[:=]\s*["'`]?([A-Za-z0-9_+/.=-]{16,})'''
secretGroup = 1
keywords = ["upstash_redis_rest_token"]
